name: Bug in the tracker or scripts
description: tools/tracker.py, tools/srs.py, tools/transcript.py or a script in scripts/ misbehaves.
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python tools/tracker.py status
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened (full output)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12.4, Windows 11
    validations:
      required: true
