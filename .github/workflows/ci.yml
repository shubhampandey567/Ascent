name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (tracker, spaced repetition, curriculum format)
        run: python -m pytest -q
      - name: Agent adapters in sync and skills valid
        run: python scripts/sync_agents.py --check
      - name: Template contains no personal learning data
        run: python scripts/check_template.py
      - name: AGENTS.md stays under Antigravity's 24 KB rule limit
        run: test "$(wc -c < AGENTS.md)" -lt 24000
