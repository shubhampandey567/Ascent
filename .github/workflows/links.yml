name: Links

on:
  schedule:
    - cron: "0 3 * * 1"  # every Monday, 03:00 UTC: resources die and move all the time
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check every link (YouTube via oEmbed titles)
        run: python scripts/check_links.py
